# Apache vhost for the ISNN desk (TLS added by certbot). Replace the ServerName
# with the desk's real hostname before enabling it.
<VirtualHost *:80>
    ServerName isnn.example.com

    ProxyPreserveHost On
    ProxyTimeout 300
    ProxyPass / http://127.0.0.1:4320/
    ProxyPassReverse / http://127.0.0.1:4320/

    # The desk itself asks for SPORTS_DESK_PASSWORD; no Apache login prompt.
    <Location />
        Require all granted
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/isnn-error.log
    CustomLog ${APACHE_LOG_DIR}/isnn-access.log combined
</VirtualHost>
