# Runs on the server from /opt/isnn (source checked out in ./src).
services:
  isnn:
    build: ./src
    image: isnn:latest
    container_name: isnn
    restart: unless-stopped
    # SPORTS_*, YOUTUBE_* and SPORTS_DESK_PASSWORD live in /opt/isnn/.env.
    env_file: .env
    environment:
      PUBLIC_URL: https://isnn.example.com
    ports:
      - "127.0.0.1:4320:4320"
    volumes:
      - ./data:/data
      - ./models:/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The handoff's render budget: two vCPUs and 1,800 MB for the show.
    cpus: 2
    mem_limit: 1800m
