name: Checks
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Offline proof of the show: fixture episode plus one Short per segment,
      # with a placeholder narrator so no model download is needed in CI.
      - run: npm run render:fixture -- --voice none --out fixture-output
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-episode
          path: fixture-output
          retention-days: 7
